[project]
name = "delta-chat"
version = "0.1.0"
description = "Document Delta & Grounded Chat — compute and chat over engineering-drawing revision deltas"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "rapidfuzz>=3.6",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.9",
    "ezdxf>=1.1",
    "rank-bm25>=0.2.2",
    "litellm>=1.40",
    "tiktoken>=0.7",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Heavy / optional engines kept out of the default install so the critical path stays light.
ocr = ["python-doctr>=0.8"]
eval = ["ragas>=0.1", "deepeval>=0.21"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]

[project.scripts]
delta-chat = "delta_chat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delta_chat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "llm: live LLM tests (need creds); excluded from CI default",
    "slow: needs system binaries e.g. tesseract; may be skipped in CI",
]

[dependency-groups]
# Dev deps available to `uv run pytest` without a separate install step.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]
