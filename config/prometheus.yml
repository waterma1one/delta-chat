# Minimal scrape config for the opt-in `obs` docker-compose profile. Not on the critical path —
# the app exposes GET /metrics (src/delta_chat/observability/metrics.py) unconditionally, so this
# is only consumed when you run `make up-obs` / `docker compose --profile obs up`.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: delta-chat-app
    static_configs:
      - targets: ["app:8000"]
    metrics_path: /metrics
