# Central configuration. Nothing downstream hardcodes a threshold — everything reads from here.
# Env override convention: DELTA_CHAT__<SECTION>__<KEY>=value  (double underscore nests; YAML-parsed).
#   e.g. DELTA_CHAT__DELTA__TAU=0.4   or   DELTA_CHAT__LLM__MODEL=claude-opus-4-8

llm:
  provider: auto                 # auto = pick by which API key env var is present
  model: claude-sonnet-5         # pinned model id (determinism)
  temperature: 0
  max_tokens: 1024
  timeout_s: 60
  max_retries: 4

delta:
  tau: 0.35                       # match acceptance threshold
  spatial_metric: centroid        # centroid (default) | iou
  weights:
    text: 0.55
    spatial: 0.25
    type: 0.10
    region: 0.10
  thresholds:
    unchanged_text_sim: 0.97
    unchanged_centroid_frac: 0.01
    moved_text_sim: 0.90
  notes:
    semantic_low: null            # calibrated on train split (§05/§10) — not hardcoded
    semantic_high: null

tagging:
  # ISA-5.1 house standards vary → keep configurable.
  instrument_regex: '\b([A-Z]{2,5})-?\s?(\d{2,4})([A-Z]?)\b'
  line_number_regex: '\b(\d{1,2}(?:/\d)?"?)-([A-Z]{1,3})-([A-Z0-9-]+)\b'
  equipment_regex: '\b([A-Z]{1,3})-?(\d{2,4})([A-Z]?)\b'
  isa_first_letters: ["F", "L", "P", "T", "A", "D", "I", "S", "W", "H"]
  equipment_first_letters: ["P", "V", "E", "T", "K", "C"]

chat:
  retrieval: bm25                 # bm25 | hybrid
  grounding: json                 # json | anthropic_citations
  top_k: 8
  rrf_k: 60
  sufficiency:
    margin_min: 0.15
    use_entailment_check: true

ingest:
  ocr_engine: tesseract           # tesseract | doctr
  dpi: 250
  native_text_word_threshold: 20  # >N words => pdf_native, else pdf_scanned
  vector_min_area: 1.0            # drop degenerate get_drawings() paths (pt^2)

obs:
  capture_payloads: true          # default ON for demo (synthetic samples, no PII)
  trace_dir: traces
  otlp_enabled: false
  otlp_endpoint: http://localhost:4317

samples:
  out_dir: data/samples
  scanned:
    dpi: 220
    skew_deg: 2.0
    jpeg_quality: 60
    noise_sigma: 8
  seed: 1234

eval:
  taus: [0.5, 0.6, 0.7, 0.8]
  retrieval_ks: [1, 3, 5, 10]
  judge:
    model: gpt-4o-mini            # cross-family vs llm.model
    scale: 4
    n_samples: 3
  datasets:
    dir: eval/datasets
    dataset_version: v1
    split:
      train: [pair_01_native]
      test: [pair_02_hard, pair_03_scanned, pair_04_multisheet, pair_05_dxf]
  regression_thresholds:
    delta_f1_test: 0.02
    citation_validity: 0.0
  budget:
    sheets_extrapolation: 500

api:
  host: 127.0.0.1
  port: 8000
  web_dir: src/delta_chat/api/web
