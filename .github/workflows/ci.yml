name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: uv sync
      # data/samples/**/*.pdf are gitignored (regenerable, not committed) — synthesize them so
      # tests that need real sample pairs (e.g. tests/test_cli.py) run for real instead of skipping.
      - run: uv run python scripts/synth_samples.py
      # deterministic + mocked-LLM suite (no @pytest.mark.llm tests exist yet, so this is
      # currently the full suite); coverage-gated on the deterministic core packages.
      - run: >
          uv run pytest -m "not llm" --cov=src/delta_chat/canonical
          --cov=src/delta_chat/ingest --cov=src/delta_chat/delta --cov=eval
          --cov-fail-under=80

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # FULL history — required, submission is full history
      - uses: gitleaks/gitleaks-action@v2

  deterministic-eval:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: uv sync
      - run: uv run python scripts/synth_samples.py
      # `--offline` runs the real ingest -> delta -> retrieval pipeline (pure code) but stubs chat
      # generation + the judge (see eval/run_eval.py's `_offline_llm_complete`/`_OfflineJudge`), so
      # this needs no ANTHROPIC/OPENAI key. It diffs against the committed baseline and exits
      # non-zero only on a DETERMINISTIC regression (delta P/R/F1, citation validity, latency,
      # cost) — model-graded metrics are never gating.
      - run: >
          PYTHONPATH=src uv run python -m eval.run_eval --offline
          --baseline eval/baseline_scorecard.json
